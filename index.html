<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Mole Bridge - SPA</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* === SETUP GLOBAL & RESPONSIVITAS === */
        body {
            display: flex; justify-content: center; align-items: center;     
            height: 100vh; height: 100svh; width: 100vw;
            background-color: #1a1a1a; margin: 0; padding: 0;
            font-family: 'VT323', monospace; color: white;
            touch-action: none; overflow: hidden;        
        }
        #game-container {
            position: relative; width: 100%; height: 100%;
            max-width: calc(100vh * (16 / 9)); max-width: calc(100svh * (16 / 9));
            max-height: calc(100vw * (9 / 16)); aspect-ratio: 16 / 9;
            background-color: #000;
            image-rendering: pixelated; image-rendering: crisp-edges;
            container-type: inline-size; overflow: hidden;
        }

        .scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        
        .layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
            image-rendering: inherit;
        }
        
        .btn-grid { position: absolute; background: transparent; border: none; cursor: pointer; z-index: 10; }
        .popup-layer { display: none; z-index: 20; }
        
        .calc-text {
            position: absolute; height: 11.11%; width: 25%; display: flex; align-items: center; justify-content: center; text-align: center; color: #000; font-size: 3cqw;
        }

        /* === TITLE SCREEN === */
        #scene-title { display: block; z-index: 50; transition: opacity 0.5s ease; background-color: #000; }
        #layer-titlescreen { background-image: url('titlescreen.png'); }


        /* === SCENE 1: TIMBANGAN MOL === */
        #layer-canvas-mol { background-image: url('kanvasmb.png'); z-index: 1; }
        #layer-bottle-mol { z-index: 2; transition: background-image 0.1s; }
        
        #layer-salt-mol {
            position: absolute; left: 43.75%; top: 66.66%; width: 12.5%; height: 22.22%;
            display: flex; justify-content: center; align-items: center; z-index: 3;
        }
        .salt-pile { background-color: #ffffff; border-radius: 50%; width: 0%; height: 0%; transition: all 0.3s ease; }

        #layer-key-mol { background-image: url('keymb.png'); z-index: 4; pointer-events: none; }
        #layer-nav-mol { background-image: url('mbkey1.png'); z-index: 5; pointer-events: none; }

        #scale-display {
            position: absolute; left: 43.75%; top: 88.88%; width: 12.5%; height: 11.11%;
            display: flex; justify-content: center; align-items: center; text-align: center;
            color: #5b7ea4; font-size: 3.5cqw; z-index: 5;
        }

        #popup-shelf { background-image: url('mbshelf.png'); }
        #popup-calc-mol { background-image: url('popupmb.png'); }
        #calc-mass-mol { left: 43.75%; top: 33.33%; } 
        #calc-mr-mol { left: 43.75%; top: 44.44%; }   
        #calc-result-mol { left: 43.75%; top: 55.55%; } 


        /* === SCENE 2: JUMLAH PARTIKEL === */
        #layer-canvas-partikel { background-image: url('kanvasmbp.png'); z-index: 1; }
        
        /* OPTIMASI MEMORI: Ukuran pas 100%, background-position digeser via JS */
        #layer-lattice-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; cursor: grab; background-repeat: repeat, repeat;
        }
        #layer-lattice-container:active { cursor: grabbing; }

        #layer-infokey { background-image: url('mbpinfokey.png'); z-index: 3; pointer-events: none; }
        #layer-zat-label { z-index: 4; pointer-events: none; } /* Gambar dinamis mbp...png */
        #layer-nav-partikel { background-image: url('mbkey2.png'); z-index: 4; pointer-events: none; }

        #text-mol-display {
            position: absolute; left: 81.25%; top: 66.66%; width: 18.75%; height: 11.11%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 4cqw; z-index: 5; text-shadow: 2px 2px 0 #000;
        }

        #popup-calc-partikel { background-image: url('popupmbp.png'); }
        .calc-text-partikel {
            position: absolute; display: flex; align-items: center; justify-content: center; 
            color: #000; font-size: 3.5cqw; font-weight: normal; /* REVISI: Font Normal */
        }
        #calc-input-mol { left: 37.5%; top: 44.44%; width: 18.75%; height: 11.11%; } 
        #calc-result-partikel { left: 37.5%; top: 55.55%; width: 12.5%; height: 11.11%; }


        /* === SCENE 3: MOLARITAS === */
        #layer-canvas-molar { background-image: url('kanvasmbm.png'); z-index: 1; }
        #layer-aqua { background-image: url('mbaqua11.png'); z-index: 2; }
        #water-stream { position: absolute; left: 45.3%; top: 22.5%; width: 0.6%; height: 0%; background-color: rgba(180, 230, 255, 0.6); z-index: 2; transition: height 0.1s ease; }
        
        #beaker-fluid-container {
            position: absolute; left: 37.5%; top: 33.33%; width: 31.25%; height: 55.55%;
            z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; overflow: hidden;
            border-bottom-left-radius: 3cqw; border-bottom-right-radius: 3cqw;
        }
        #layer-liquid { width: 100%; height: 0%; background-color: rgba(180, 230, 255, 0.25); transition: height 0.1s ease, background-color 0.5s ease; }
        #layer-precipitate { width: 100%; height: 0%; background-color: transparent; transition: height 0.4s ease, background-color 0.3s ease; }
        
        #layer-stir { background-image: url('mbgstir.png'); z-index: 2; display: block; }
        #layer-hand-pour { background-image: url('mbgstir1.png'); z-index: 2; display: none; }
        #layer-glass { background-image: url('mbglass.png'); z-index: 3; pointer-events: none; }
        #layer-key-molar { background-image: url('keymbm.png'); z-index: 4; pointer-events: none; }
        #layer-key-add { background-image: url('keymbm1.png'); z-index: 5; pointer-events: none; display: none; }
        #layer-nav-molar { background-image: url('mbkey3.png'); z-index: 5; pointer-events: none; }

        #volume-display {
            position: absolute; left: 50%; top: 88.88%; width: 12.5%; height: 11.11%;
            display: flex; justify-content: center; align-items: center; text-align: center;
            color: #dcdde1; font-size: 3.5cqw; z-index: 6; 
        }

        #alert-msg {
            position: absolute; top: 12%; left: 50%; transform: translateX(-50%);
            color: #e74c3c; font-size: 2.8cqw; font-weight: bold; text-shadow: 2px 2px 0 #000;
            opacity: 0; transition: opacity 0.3s ease; z-index: 7; pointer-events: none;
        }

        #popup-molarity { background-image: url('popupmbm.png'); }
        #popup-solubility { background-image: url('mbsolubility.png'); }
        #calc-mol-molar { left: 43.75%; top: 33.33%; } 
        #calc-liter-molar { left: 43.75%; top: 44.44%; }   
        #calc-result-molar { left: 43.75%; top: 55.55%; } 

        #sim-status { position: absolute; left: 31.25%; top: 11.11%; width: 25%; height: 11.11%; display: flex; align-items: center; justify-content: center; color: white; font-size: 4cqw; z-index: 21; text-shadow: 2px 2px 0 #000; }
        .part-sprite { position: absolute; height: 11.11%; width: 6.25%; background-size: contain; background-position: center; background-repeat: no-repeat; z-index: 21; }
        .part-text { position: absolute; height: 11.11%; width: 18.75%; display: flex; align-items: center; justify-content: flex-start; color: white; font-size: 3cqw; z-index: 21; padding-left: 1%; text-shadow: 1px 1px 0 #000; }
        #ui-sprite-1 { left: 12.5%; top: 88.88%; }
        #ui-text-1 { left: 18.75%; top: 88.88%; }
        #ui-sprite-2 { left: 37.5%; top: 88.88%; }
        #ui-text-2 { left: 43.75%; top: 88.88%; }
        #ui-text-air { position: absolute; left: 75%; top: 88.88%; width: 12.5%; height: 11.11%; display: flex; align-items: center; justify-content: center; color: white; font-size: 3cqw; z-index: 21; text-shadow: 1px 1px 0 #000; }
        #particle-canvas { position: absolute; left: 12.5%; top: 22.22%; width: 75%; height: 55.55%; z-index: 21; overflow: hidden; }
        .atom-node { position: absolute; background-size: contain; background-position: center; background-repeat: no-repeat; transform-origin: center center; }

    </style>
</head>
<body>

<div id="game-container">

    <div id="scene-title" class="scene">
        <div id="layer-titlescreen" class="layer"></div>
        <button class="btn-grid" style="left: 37.5%; top: 55.55%; width: 25%; height: 22.22%; z-index: 52;" onclick="mulaiSimulasi()"></button>
    </div>

    <div id="scene-timbangan" class="scene">
        <div id="layer-canvas-mol" class="layer"></div>
        <div id="layer-bottle-mol" class="layer"></div>
        <div id="layer-salt-mol"><div id="salt-pile" class="salt-pile"></div></div>
        <div id="layer-key-mol" class="layer"></div>
        <div id="layer-nav-mol" class="layer"></div>
        <div id="scale-display">0,0</div>

        <button class="btn-grid" style="left: 6.25%; top: 22.22%; width: 18.75%; height: 11.11%;" onclick="bukaRak()"></button>
        <button class="btn-grid" style="left: 6.25%; top: 77.77%; width: 6.25%; height: 11.11%;" onclick="tambahMassa(5)"></button>
        <button class="btn-grid" style="left: 12.5%; top: 77.77%; width: 6.25%; height: 11.11%;" onclick="tambahMassa(1)"></button>
        <button class="btn-grid" style="left: 18.75%; top: 77.77%; width: 6.25%; height: 11.11%;" onclick="tambahMassa(0.5)"></button>
        <button class="btn-grid" style="left: 6.25%; top: 88.88%; width: 18.75%; height: 11.11%;" onclick="resetTimbangan()"></button>
        <button class="btn-grid" style="left: 75%; top: 77.77%; width: 6.25%; height: 11.11%;" onclick="autoMol(1)"></button>
        <button class="btn-grid" style="left: 81.25%; top: 77.77%; width: 6.25%; height: 11.11%;" onclick="autoMol(0.5)"></button>
        <button class="btn-grid" style="left: 87.5%; top: 77.77%; width: 6.25%; height: 11.11%;" onclick="autoMol(0.1)"></button>
        <button class="btn-grid" style="left: 75%; top: 88.88%; width: 18.75%; height: 11.11%;" onclick="bukaHitungMol()"></button>

        <button class="btn-grid" style="left: 87.5%; top: 11.11%; width: 12.5%; height: 11.11%;" onclick="gotoScene('scene-partikel')"></button>
        <button class="btn-grid" style="left: 87.5%; top: 22.22%; width: 12.5%; height: 11.11%;" onclick="gotoScene('scene-molaritas')"></button>

        <div id="popup-shelf" class="layer popup-layer">
            <button class="btn-grid" style="left: 6.25%; top: 11.11%; width: 12.5%; height: 33.33%; z-index: 21;" onclick="pilihZat('s')"></button>
            <button class="btn-grid" style="left: 25%; top: 11.11%; width: 12.5%; height: 33.33%; z-index: 21;" onclick="pilihZat('nacl')"></button>
            <button class="btn-grid" style="left: 43.75%; top: 11.11%; width: 12.5%; height: 33.33%; z-index: 21;" onclick="pilihZat('naoh')"></button>
            <button class="btn-grid" style="left: 62.5%; top: 11.11%; width: 12.5%; height: 33.33%; z-index: 21;" onclick="pilihZat('c')"></button>
            <button class="btn-grid" style="left: 81.25%; top: 11.11%; width: 12.5%; height: 33.33%; z-index: 21;" onclick="pilihZat('fe')"></button>
            <button class="btn-grid" style="left: 93.75%; top: 0%; width: 6.25%; height: 11.11%; z-index: 21;" onclick="tutupRak()"></button>
        </div>
        <div id="popup-calc-mol" class="layer popup-layer">
            <button class="btn-grid" style="left: 87.5%; top: 22.22%; width: 6.25%; height: 11.11%; z-index: 21;" onclick="tutupHitungMol()"></button>
            <div id="calc-mass-mol" class="calc-text">0,0 g</div>
            <div id="calc-mr-mol" class="calc-text">0 g/mol</div>
            <div id="calc-result-mol" class="calc-text">0,0 mol</div>
        </div>
    </div>


    <div id="scene-partikel" class="scene">
        <div id="layer-canvas-partikel" class="layer"></div>
        <div id="layer-lattice-container"></div>
        <div id="layer-infokey" class="layer"></div>
        <div id="layer-zat-label" class="layer"></div>
        <div id="layer-nav-partikel" class="layer"></div>
        <div id="text-mol-display">0 mol</div>

        <button class="btn-grid" style="left: 93.75%; top: 0%; width: 6.25%; height: 11.11%;" onclick="gotoScene('scene-title')"></button>

        <button class="btn-grid" style="left: 87.5%; top: 11.11%; width: 12.5%; height: 11.11%;" onclick="gotoScene('scene-timbangan')"></button>
        <button class="btn-grid" style="left: 87.5%; top: 22.22%; width: 12.5%; height: 11.11%;" onclick="gotoScene('scene-molaritas')"></button>
        <button class="btn-grid" style="left: 81.25%; top: 77.77%; width: 18.75%; height: 11.11%;" onclick="bukaHitungPartikel()"></button>

        <div id="popup-calc-partikel" class="layer popup-layer">
            <button class="btn-grid" style="left: 87.5%; top: 22.22%; width: 6.25%; height: 11.11%; z-index: 21;" onclick="tutupHitungPartikel()"></button>
            <div id="calc-input-mol" class="calc-text-partikel">0 mol</div>
            <div id="calc-result-partikel" class="calc-text-partikel">0</div>
        </div>
    </div>


    <div id="scene-molaritas" class="scene">
        <div id="layer-canvas-molar" class="layer"></div>
        <div id="beaker-fluid-container">
            <div id="layer-liquid"></div>
            <div id="layer-precipitate"></div>
        </div>
        <div id="water-stream"></div>
        <div id="layer-stir" class="layer"></div>
        <div id="layer-hand-pour" class="layer"></div>
        <div id="layer-aqua" class="layer"></div>
        <div id="layer-glass" class="layer"></div>
        <div id="layer-key-molar" class="layer"></div>
        <div id="layer-key-add" class="layer"></div>
        <div id="layer-nav-molar" class="layer"></div>
        <div id="volume-display">0</div>
        <div id="alert-msg"></div>

        <button id="btn-add-water" class="btn-grid" style="left: 6.25%; top: 33.33%; width: 18.75%; height: 11.11%;" onmousedown="mulaiTuangAir()" onmouseup="hentiTuangAir()" onmouseleave="hentiTuangAir()" ontouchstart="mulaiTuangAir()" ontouchend="hentiTuangAir()"></button>
        <button id="btn-add-substance" class="btn-grid" style="left: 6.25%; top: 55.55%; width: 18.75%; height: 11.11%; display: none;" onclick="eksekusiTambahZat()"></button>
        <button class="btn-grid" style="left: 6.25%; top: 77.77%; width: 18.75%; height: 11.11%;" onclick="resetSimulasiMolar()"></button>
        <button class="btn-grid" style="left: 75%; top: 33.33%; width: 18.75%; height: 11.11%;" onclick="bukaSolubility()"></button>
        <button class="btn-grid" style="left: 75%; top: 77.77%; width: 18.75%; height: 11.11%;" onclick="bukaMolaritas()"></button>

        <button class="btn-grid" style="left: 87.5%; top: 11.11%; width: 12.5%; height: 11.11%;" onclick="gotoScene('scene-timbangan')"></button>

        <div id="popup-molarity" class="layer popup-layer">
            <button class="btn-grid" style="left: 87.5%; top: 22.22%; width: 6.25%; height: 11.11%; z-index: 22;" onclick="tutupMolaritas()"></button>
            <div id="calc-mol-molar" class="calc-text">0,0 mol</div>
            <div id="calc-liter-molar" class="calc-text">0,0 L</div>
            <div id="calc-result-molar" class="calc-text">0,0 M</div>
        </div>
        <div id="popup-solubility" class="layer popup-layer">
            <button class="btn-grid" style="left: 93.75%; top: 0%; width: 6.25%; height: 11.11%; z-index: 22;" onclick="tutupSolubility()"></button>
            <div id="sim-status">Larut</div>
            <div id="ui-sprite-1" class="part-sprite"></div>
            <div id="ui-text-1" class="part-text">Na+</div>
            <div id="ui-sprite-2" class="part-sprite"></div>
            <div id="ui-text-2" class="part-text">Cl-</div>
            <div id="ui-text-air">Air</div>
            <div id="particle-canvas"></div>
        </div>
    </div>

</div>

<script>
    // ==========================================
    // DATABASE ZAT & STATE GLOBAL
    // ==========================================
    const databaseZat = {
        'nacl': { symbol: 'nacl', mr: 58, color: '#ffffff', larut: true, ion1: { sprite: 'mbpartna.png', text: 'Na+', charge: 1 }, ion2: { sprite: 'mbpartcl.png', text: 'Cl-', charge: -1 } },
        'naoh': { symbol: 'naoh', mr: 40, color: '#ffffff', larut: true, ion1: { sprite: 'mbpartna.png', text: 'Na+', charge: 1 }, ion2: { sprite: 'mbpartoh.png', text: 'OH-', charge: -1 } },
        'c':    { symbol: 'c', mr: 12, color: '#2c3e50', larut: false, ion1: { sprite: 'mbpartc.png', text: 'Karbon', charge: 0 }, ion2: null },
        's':    { symbol: 's', mr: 32, color: '#f1c40f', larut: false, ion1: { sprite: 'mbparts.png', text: 'Sulfur', charge: 0 }, ion2: null },
        'fe':   { symbol: 'fe', mr: 56, color: '#95a5a6', larut: false, ion1: { sprite: 'mbpartfe.png', text: 'Besi', charge: 0 }, ion2: null }
    };

    let zatAktif = databaseZat['nacl'];
    let massaTimbangan = 0;

    function formatDesimal2(angka) { return angka === 0 ? "0" : angka.toFixed(2).replace('.', ','); }
    function formatMassa(angka) { return angka.toFixed(1).replace('.', ','); }
    function formatMol(angka) { return String(Math.round(angka * 1000) / 1000).replace('.', ','); }

    function getGlobalMol() { return massaTimbangan / zatAktif.mr; }

    // ==========================================
    // MANAJEMEN NAVIGASI SCENE
    // ==========================================
    const scenes = ['scene-title', 'scene-timbangan', 'scene-partikel', 'scene-molaritas'];
    
    function mulaiSimulasi() {
        let elTitle = document.getElementById('scene-title');
        elTitle.style.opacity = '0';
        setTimeout(() => { gotoScene('scene-timbangan'); elTitle.style.opacity = '1'; }, 500);
    }

    function gotoScene(sceneId) {
        // Matikan semua scene
        scenes.forEach(id => document.getElementById(id).style.display = 'none');
        
        // Aturan spesifik saat memasuki scene tertentu
        if(sceneId === 'scene-molaritas' && massaTimbangan === 0) {
            alert("Harap menimbang zat terlebih dahulu di Pulau Penentuan Mol!");
            document.getElementById('scene-timbangan').style.display = 'block';
            return;
        }
        
        if (sceneId === 'scene-partikel') updateScenePartikel();
        if (sceneId === 'scene-molaritas') resetSimulasiMolar(); // Refresh gelas kimia tiap masuk
        
        document.getElementById(sceneId).style.display = 'block';
    }


    // ==========================================
    // LOGIKA SCENE 1: TIMBANGAN
    // ==========================================
    let maxKapasitas = 100; let timerWadah = null;
    const elTimbangan = document.getElementById('scale-display');
    const elWadahBotol = document.getElementById('layer-bottle-mol');
    const elGaramPile = document.getElementById('salt-pile');
    const popupShelf = document.getElementById('popup-shelf');
    const popupCalcMol = document.getElementById('popup-calc-mol');

    function bukaWadahSementara() {
        elWadahBotol.style.backgroundImage = `url('mb${zatAktif.symbol}1.png')`;
        if (timerWadah) clearTimeout(timerWadah);
        timerWadah = setTimeout(() => { elWadahBotol.style.backgroundImage = `url('mb${zatAktif.symbol}.png')`; }, 3000);
    }

    function updateVisualMol() {
        elTimbangan.innerText = formatMassa(massaTimbangan);
        let persentase = (massaTimbangan / maxKapasitas) * 100;
        elGaramPile.style.width = persentase + '%'; elGaramPile.style.height = (persentase * 0.5) + '%'; 
    }

    function pilihZat(simbol) {
        zatAktif = databaseZat[simbol]; resetTimbangan(); 
        elWadahBotol.style.backgroundImage = `url('mb${zatAktif.symbol}.png')`;
        elGaramPile.style.backgroundColor = zatAktif.color;
        tutupRak();
    }

    function tambahMassa(jumlah) {
        if (massaTimbangan + jumlah > maxKapasitas) return;
        massaTimbangan += jumlah; bukaWadahSementara(); updateVisualMol();
    }
    function resetTimbangan() { massaTimbangan = 0; bukaWadahSementara(); updateVisualMol(); }
    function autoMol(targetMol) {
        let targetMassa = targetMol * zatAktif.mr;
        if (targetMassa > maxKapasitas) return; 
        massaTimbangan = targetMassa; bukaWadahSementara(); updateVisualMol();
    }
    function bukaHitungMol() {
        document.getElementById('calc-mass-mol').innerText = formatMassa(massaTimbangan) + ' g';
        document.getElementById('calc-mr-mol').innerText = zatAktif.mr + ' g/mol';
        document.getElementById('calc-result-mol').innerText = formatMol(getGlobalMol()) + ' mol';
        popupCalcMol.style.display = 'block';
    }
    function tutupHitungMol() { popupCalcMol.style.display = 'none'; }
    function bukaRak() { popupShelf.style.display = 'block'; }
    function tutupRak() { popupShelf.style.display = 'none'; }
    elWadahBotol.style.backgroundImage = `url('mb${zatAktif.symbol}.png')`; updateVisualMol();


    // ==========================================
    // LOGIKA SCENE 2: JUMLAH PARTIKEL
    // ==========================================
    const popCalcPartikel = document.getElementById('popup-calc-partikel');
    const latticeContainer = document.getElementById('layer-lattice-container');
    const layerZatLabel = document.getElementById('layer-zat-label');
    
    function updateScenePartikel() {
        let mol = getGlobalMol();
        let txtMol = mol === 0 ? "0 mol" : formatDesimal2(mol) + " mol";
        document.getElementById('text-mol-display').innerText = txtMol;
        
        layerZatLabel.style.backgroundImage = `url('mbp${zatAktif.symbol}.png')`;

        // Update Background Tekstur Dinamis (Optimasi Memori)
        if (mol === 0) {
            latticeContainer.style.backgroundImage = 'none';
        } else {
            if(zatAktif.ion2) {
                latticeContainer.style.backgroundImage = `url('${zatAktif.ion1.sprite}'), url('${zatAktif.ion2.sprite}')`;
                latticeContainer.style.backgroundSize = '6cqw 6cqw, 6cqw 6cqw';
            } else {
                latticeContainer.style.backgroundImage = `url('${zatAktif.ion1.sprite}')`;
                latticeContainer.style.backgroundSize = '6cqw 6cqw';
            }
        }
    }

    function bukaHitungPartikel() {
        let mol = getGlobalMol();
        document.getElementById('calc-input-mol').innerText = mol === 0 ? "0 mol" : formatDesimal2(mol) + " mol";
        let hasilKoefisien = mol * 6.022;
        document.getElementById('calc-result-partikel').innerText = mol === 0 ? "0" : formatDesimal2(hasilKoefisien);
        popCalcPartikel.style.display = 'block';
    }
    function tutupHitungPartikel() { popCalcPartikel.style.display = 'none'; }

    // Infinite Background Engine 
    let isDragging = false; let startX, startY; let driftX = 0, driftY = 0; 
    function renderInfinity() {
        let mol = getGlobalMol();
        if (!isDragging && mol > 0) { driftX += 0.3; driftY += 0.3; }
        
        if (zatAktif.ion2) {
            latticeContainer.style.backgroundPosition = `${driftX}px ${driftY}px, calc(${driftX}px + 3cqw) calc(${driftY}px + 3cqw)`;
        } else {
            latticeContainer.style.backgroundPosition = `${driftX}px ${driftY}px`; // Atom tunggal tidak offset
        }
        requestAnimationFrame(renderInfinity);
    }
    renderInfinity(); 

    latticeContainer.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX; startY = e.clientY; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mouseleave', () => { isDragging = false; });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        driftX += e.clientX - startX; driftY += e.clientY - startY;
        startX = e.clientX; startY = e.clientY;
    });
    latticeContainer.addEventListener('touchstart', (e) => { isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
    window.addEventListener('touchend', () => { isDragging = false; });
    window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        driftX += e.touches[0].clientX - startX; driftY += e.touches[0].clientY - startY;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    });


    // ==========================================
    // LOGIKA SCENE 3: MOLARITAS
    // ==========================================
    let volumeAir_mL = 0; let zatTelahDituang = false; let larutanTelahDiaduk = false;
    let sistemSedangAnimasi = false; let tuangAirInterval = null;

    const elAlert = document.getElementById('alert-msg');
    const elAqua = document.getElementById('layer-aqua');
    const elWaterStream = document.getElementById('water-stream');
    const elLiquid = document.getElementById('layer-liquid');
    const elVolumeDisplay = document.getElementById('volume-display');
    const elKeyAdd = document.getElementById('layer-key-add');
    const btnAddSubstance = document.getElementById('btn-add-substance');
    const elHandPour = document.getElementById('layer-hand-pour');
    const elPrecipitate = document.getElementById('layer-precipitate');
    const elStir = document.getElementById('layer-stir');
    const popMolarity = document.getElementById('popup-molarity');
    const popSolubility = document.getElementById('popup-solubility');

    function tampilkanPeringatan(teks) { elAlert.innerText = teks; elAlert.style.opacity = '1'; setTimeout(() => elAlert.style.opacity = '0', 2500); }
    function updateVisualBotolMiring() { elAqua.style.backgroundImage = volumeAir_mL <= 500 ? "url('mbaqua11x.png')" : "url('mbaqua01x.png')"; }
    function updateVisualBotolDiam() {
        if (volumeAir_mL === 0 || volumeAir_mL < 500) elAqua.style.backgroundImage = "url('mbaqua11.png')";
        else if (volumeAir_mL === 500 || volumeAir_mL < 1000) elAqua.style.backgroundImage = "url('mbaqua01.png')"; 
        else elAqua.style.backgroundImage = "url('mbaqua00.png')";
    }

    function prosesTuang100mL() {
        if (volumeAir_mL >= 1000) { hentiTuangAir(); return; }
        volumeAir_mL += 100; updateVisualBotolMiring();
        elLiquid.style.height = (volumeAir_mL / 1000) * 100 + '%';
        let liter = volumeAir_mL / 1000; elVolumeDisplay.innerText = liter === 0 ? "0" : liter.toFixed(1).replace('.', ',');
        if (volumeAir_mL >= 100 && !zatTelahDituang) { elKeyAdd.style.display = 'block'; btnAddSubstance.style.display = 'block'; }
    }

    function mulaiTuangAir() {
        if (sistemSedangAnimasi || volumeAir_mL >= 1000) return;
        elWaterStream.style.height = '33%'; prosesTuang100mL(); 
        tuangAirInterval = setInterval(() => { prosesTuang100mL(); }, 350); 
    }
    function hentiTuangAir() { clearInterval(tuangAirInterval); elWaterStream.style.height = '0%'; updateVisualBotolDiam(); }

    function eksekusiTambahZat() {
        if (sistemSedangAnimasi || zatTelahDituang) return;
        sistemSedangAnimasi = true; elKeyAdd.style.display = 'none'; btnAddSubstance.style.display = 'none';
        elHandPour.style.display = 'block'; elPrecipitate.style.height = '12%'; elPrecipitate.style.backgroundColor = zatAktif.color;
        setTimeout(() => {
            elHandPour.style.display = 'none'; elStir.style.backgroundImage = "url('mbgstirx.gif')";
            setTimeout(() => {
                elStir.style.backgroundImage = "url('mbgstir.png')"; zatTelahDituang = true; larutanTelahDiaduk = true;
                if(zatAktif.larut) { elPrecipitate.style.height = '0%'; elLiquid.style.backgroundColor = 'rgba(230, 245, 255, 0.5)'; }
                sistemSedangAnimasi = false;
            }, 2000);
        }, 1000);
    }

    function resetSimulasiMolar() {
        if (sistemSedangAnimasi) return;
        volumeAir_mL = 0; zatTelahDituang = false; larutanTelahDiaduk = false;
        elVolumeDisplay.innerText = "0"; elLiquid.style.height = '0%'; elLiquid.style.backgroundColor = 'rgba(180, 230, 255, 0.25)';
        elPrecipitate.style.height = '0%'; updateVisualBotolDiam(); 
        elKeyAdd.style.display = 'none'; btnAddSubstance.style.display = 'none';
        tutupMolaritas(); tutupSolubility();
    }

    function bukaMolaritas() {
        if (volumeAir_mL === 0) { tampilkanPeringatan("TAMBAHKAN AIR TERLEBIH DAHULU!"); return; }
        let globalMol = getGlobalMol(); let volLiters = volumeAir_mL / 1000;
        let hasilM = (larutanTelahDiaduk && zatAktif.larut) ? (globalMol / volLiters) : 0;
        
        document.getElementById('calc-mol-molar').innerText = formatMol(globalMol) + " mol";
        let txtL = volLiters === 1 ? "1,0" : volLiters.toFixed(1).replace('.', ',');
        document.getElementById('calc-liter-molar').innerText = txtL + " L";
        document.getElementById('calc-result-molar').innerText = formatMol(hasilM) + " M";
        popMolarity.style.display = 'block';
    }
    function tutupMolaritas() { popMolarity.style.display = 'none'; }


    // === ENGINE FISIKA PARTIKEL (SOLUBILITY) ===
    let particles = []; let animFrameId = null; const pCanvas = document.getElementById('particle-canvas');

    function bukaSolubility() { 
        if (volumeAir_mL === 0) { tampilkanPeringatan("TAMBAHKAN AIR TERLEBIH DAHULU!"); return; }
        popSolubility.style.display = 'block'; setupUISolubility(); mulaiEnginePartikel();
    }
    function tutupSolubility() { 
        popSolubility.style.display = 'none'; 
        if (animFrameId) cancelAnimationFrame(animFrameId); pCanvas.innerHTML = ''; particles = [];
    }
    function setupUISolubility() {
        const isLarut = larutanTelahDiaduk && zatAktif.larut;
        document.getElementById('sim-status').innerText = isLarut ? "Larut" : "Tidak larut";
        document.getElementById('ui-sprite-1').style.backgroundImage = `url('${zatAktif.ion1.sprite}')`;
        document.getElementById('ui-text-1').innerText = zatAktif.ion1.text;
        if (zatAktif.ion2) {
            document.getElementById('ui-sprite-2').style.backgroundImage = `url('${zatAktif.ion2.sprite}')`;
            document.getElementById('ui-text-2').innerText = zatAktif.ion2.text;
            document.getElementById('ui-sprite-2').style.display = 'block'; document.getElementById('ui-text-2').style.display = 'flex';
        } else {
            document.getElementById('ui-sprite-2').style.display = 'none'; document.getElementById('ui-text-2').style.display = 'none';
        }
    }

    class Partikel {
        constructor(type, x, y, size, sprite, charge) {
            this.type = type; this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 0.8; this.vy = (Math.random() - 0.5) * 0.8;
            this.size = size; this.charge = charge; this.angle = Math.random() * 360; 
            this.element = document.createElement('div'); this.element.className = 'atom-node';
            this.element.style.width = size + 'px'; this.element.style.height = size + 'px';
            this.element.style.backgroundImage = `url('${sprite}')`; pCanvas.appendChild(this.element);
        }
        update(canvasWidth, canvasHeight) {
            this.x += this.vx; this.y += this.vy;
            if (this.x <= 0) { this.x = 0; this.vx *= -1; }
            if (this.x + this.size >= canvasWidth) { this.x = canvasWidth - this.size; this.vx *= -1; }
            if (this.y <= 0) { this.y = 0; this.vy *= -1; }
            if (this.y + this.size >= canvasHeight) { this.y = canvasHeight - this.size; this.vy *= -1; }

            if (this.type === 'water') {
                let ionTerdekat = null; let jarakTerdekat = 99999;
                for (let p of particles) {
                    if (p.type === 'ion1' || p.type === 'ion2') {
                        let dx = (p.x + p.size/2) - (this.x + this.size/2); let dy = (p.y + p.size/2) - (this.y + this.size/2);
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 120 && dist < jarakTerdekat) { jarakTerdekat = dist; ionTerdekat = p; }
                    }
                }
                if (ionTerdekat) {
                    let targetRad = Math.atan2((ionTerdekat.y + ionTerdekat.size/2) - (this.y + this.size/2), (ionTerdekat.x + ionTerdekat.size/2) - (this.x + this.size/2));
                    let targetDeg = targetRad * (180 / Math.PI);
                    if (ionTerdekat.charge === 1) this.angle = targetDeg + 90; else if (ionTerdekat.charge === -1) this.angle = targetDeg - 90;
                    if (jarakTerdekat > 40) { this.vx += Math.cos(targetRad) * 0.03; this.vy += Math.sin(targetRad) * 0.03; }
                    this.vx *= 0.98; this.vy *= 0.98;
                } else { this.angle += 0.5; }
            }
            this.element.style.left = this.x + 'px'; this.element.style.top = this.y + 'px';
            this.element.style.transform = `rotate(${this.angle}deg)`;
        }
    }

    function mulaiEnginePartikel() {
        pCanvas.innerHTML = ''; particles = [];
        let cWidth = pCanvas.clientWidth; let cHeight = pCanvas.clientHeight;
        let isLarut = larutanTelahDiaduk && zatAktif.larut;
        let globalMol = getGlobalMol(); let volLiters = volumeAir_mL / 1000;
        let molaritas = isLarut ? (globalMol / volLiters) : 0;
        
        let baseWaterCount = 45; let ionPairs = isLarut ? Math.min(Math.round(molaritas * 5), 25) : 0;

        for (let i = 0; i < baseWaterCount; i++) particles.push(new Partikel('water', Math.random() * (cWidth - 30), Math.random() * (cHeight - 30), 30, 'mbparthoh.png', 0));

        if (isLarut && ionPairs > 0) {
            for (let i = 0; i < ionPairs; i++) {
                particles.push(new Partikel('ion1', Math.random() * cWidth, Math.random() * cHeight, 30, zatAktif.ion1.sprite, zatAktif.ion1.charge));
                if(zatAktif.ion2) particles.push(new Partikel('ion2', Math.random() * cWidth, Math.random() * cHeight, 30, zatAktif.ion2.sprite, zatAktif.ion2.charge));
            }
        } else if (!larutanTelahDiaduk && zatTelahDituang) {
            let startX = cWidth / 2 - 60; let startY = cHeight - 90; let rows = 3; let cols = 4; let spacing = 28;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let px = startX + (c * spacing); let py = startY + (r * spacing);
                    if (zatAktif.ion2) {
                        let sprite = (r + c) % 2 === 0 ? zatAktif.ion1.sprite : zatAktif.ion2.sprite;
                        let p = new Partikel('solid', px, py, 30, sprite, 0); p.vx = 0; p.vy = 0; particles.push(p);
                    } else {
                        let p = new Partikel('solid', px, py, 30, zatAktif.ion1.sprite, 0); p.vx = 0; p.vy = 0; particles.push(p);
                    }
                }
            }
        }
        loopPartikel();
    }

    function loopPartikel() {
        let cWidth = pCanvas.clientWidth; let cHeight = pCanvas.clientHeight;
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                let p1 = particles[i]; let p2 = particles[j];
                if (p1.type === 'solid' && p2.type === 'solid') continue;
                let dx = (p1.x + p1.size/2) - (p2.x + p2.size/2); let dy = (p1.y + p1.size/2) - (p2.y + p2.size/2);
                let dist = Math.sqrt(dx*dx + dy*dy); let minDist = (p1.size + p2.size) / 2;
                if (dist < minDist && dist > 0) {
                    let overlap = minDist - dist; let nx = dx / dist; let ny = dy / dist;
                    if (p1.type !== 'solid') { p1.x += nx * (overlap / 2); p1.y += ny * (overlap / 2); }
                    if (p2.type !== 'solid') { p2.x -= nx * (overlap / 2); p2.y -= ny * (overlap / 2); }
                    let tempVx = p1.vx; let tempVy = p1.vy; p1.vx = p2.vx; p1.vy = p2.vy; p2.vx = tempVx; p2.vy = tempVy;
                }
            }
        }
        for (let p of particles) { p.update(cWidth, cHeight); }
        animFrameId = requestAnimationFrame(loopPartikel);
    }
</script>
